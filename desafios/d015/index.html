<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="estilos/style.css">
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
    <title>Login</title>
</head>

<body>
    <main>
        <section id="login">
            <div id="imagem">
            </div>
            <div id="formulario">
                <h1>Login</h1>
                <p>Seja bem-vindo(a) novamente. Faça login para acessar sua conta e poder fazer as configurações no seu
                    ambiente.</p>
                <form action="login.php" method="post">
                    <div class="campo">
                        <span id="" class="material-symbols-outlined">
                            mail
                        </span>
                        <input type="email" name="email" id="email" placeholder="Seu email">
                        <label for="email">E-mail</label>
                    </div>
                    <div class="campo">
                        <span id="" class="material-symbols-outlined">
                            password
                        </span>
                        <input type="password" name="senha" id="senha" placeholder="Seu senha" maxlength="20">
                        <label for="senha">Senha</label>
                    </div>
                    <input type="submit" value="Entrar">
                </form>
                <a href="esqueci.html">Esqueci a senha <span class="material-symbols-outlined">lock_reset</span></a>
            </div>
        </section>
    </main>


</body>

</html>
