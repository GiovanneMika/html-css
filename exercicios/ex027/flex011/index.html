<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexible Box</title>
    <style>

        body {
        }
        div.container {
            background-color: lightsalmon;
            display: flex;
            flex-flow: row nowrap;
            align-items: flex-start;
            height: 400px;
        }

        div.item {
            background-color: lightskyblue;
            border: 1px solid black;
        }
        div#item1 {
            /* flex-grow: 0;
            flex-shrink: 1;
            flex-basis: 300px; */

            flex: 0 1 300px
        }
        div#item2 {
            flex-grow: 1;
            flex-shrink: 1;
            flex-basis: 300px;
        }
        div#item3 {
            flex-grow: 8;
            flex-shrink: 1;
            flex-basis: 300px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="item" id="item1">A</div>
        <div class="item" id="item2">B</div>
        <div class="item" id="item3">C</div>
    </div>
    
</body>
</html>
