<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexible Box</title>
    <style>

        body {
            font-family: 'Courier New', Courier, monospace;
        }
        div.container {
            background-color: aqua;
            display: flex;
            flex-flow: row nowrap;
            align-items: flex-start;
            height: 400px;
        }

        div.item {
            background-color: brown;
            border: 1px solid black;
            flex-basis: 150px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="item">Lorem ipsum dolor sit amet consectetur adipisicing elit. Lorem ipsum dolor sit amet consectetur adipisicing elit. Velit eligendi accusantium maxime vitae quis? Tempora!</div>
        <div class="item">B</div>
        <div class="item">C</div>
        <div class="item">D</div>
        <div class="item">E</div>
        <div class="item">F</div>
        <div class="item">G</div>
    </div>
    
</body>
</html>
