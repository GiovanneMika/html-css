<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário</title>
    <style>
        div.aluno {
            margin: 16px 0;
            display: inline-block;
            vertical-align: top;
        }
    </style>
</head>

<body>
    <h1>Meu primeiro formulário</h1>
    <form method="GET" action="cadastro.php" autocomplete="off">
        <p>
            <label for="camponome">Nome:</label>
            <input type="text" name="fname" id="camponome" required>
        </p>
        <p>
            <label for="isobrenome">Sobrenome:</label>
            <input type="text" name="sobrenome" id="isobrenome" required>
        </p>
        <input type="submit" value="Enviar">
    </form>

    <h1>Teste com usuário e senha</h1>
    <form action="cadastro.php" method="get">
        <div>
            <label for="iusuario">Usuario:</label>
            <input type="text" name="usuario" id="iusuario" minlength="5" required placeholder="Digite seu usuário"
                autocomplete="username">
        </div>
        <div>
            <label for="isenha">Senha:</label>
            <input type="password" name="senha" id="isenha" placeholder="Digite sua senha" required
                autocomplete="current-password" minlength="6">
        </div>
        <input type="submit" value="Enviar">
        <input type="reset" value="Limpar">
    </form>

    <div class="aluno">
        <fieldset>
            <legend>Aluno</legend>
            <h1>Cadastro de Aluno</h1>
            <form action="cadastro.php" method="get">
                <p>
                    <label for="ialuno">Nome do Aluno:</label>
                    <input type="text" name="aluno" id="ialuno" required>
                </p>
                <p>
                    <label for="ialturma">Turma:</label>
                    <input type="text" name="turma" id="ialturma" required>
                </p>
                <p>
                    <label for="ialunoemail">E-mail do Aluno:</label>
                    <input type="email" name="alunoemail" id="ialunoemail" required>
                </p>
                <p>
                    <label for="ialunotelefone">Telefone do Aluno:</label>
                    <input type="tel" name="alunotelefone" id="ialunotelefone" required pattern="^\d{2}\s\d{5}-\d{4}$"
                        placeholder="00 00000-0000">
                </p>
                <input type="submit" value="Enviar">
                <input type="reset" value="Limpar">
            </form>
            <h1>Cadastro de Nota</h1>
            <form action="cadastro.php" method="get">
                <p>
                    <label for="inome">Nome do aluno</label>
                    <input type="text" name="nome" id="inome" required autocomplete="name">
                </p>
                <p>
                    <label for="imedia">Média</label>
                    <input type="number" name="media" id="imedia" step="0.1" min="0" max="10" required>
                </p>
                <p>
                    <label for="iperiodo">Período Letivo</label>
                    <input type="month" name="periodo" id="iperiodo" required>
                </p>
                <p>
                    <label for="idia">Dia da prova</label>
                    <input type="date" name="dia" id="idia" required>
                </p>
                <p>
                    <label for="ihora">Hora da prova</label>
                    <input type="time" name="hora" id="ihora" required>
                </p>
                <input type="submit" value="Enviar">
                <input type="reset" value="Limpar">
            </form>
        </fieldset>
    </div>
    <div class="aluno">
        <fieldset>
            <legend>Informações Adicionais</legend>
            <h1>Esporte</h1>
            <form action="cadastro.php" method="post">
                <p>
                    <label for="iesporte">Esporte Favorito:</label>
                    <input type="text" name="esporte" id="iesporte" required>
                </p>
                <p>
                    <input type="checkbox" name="equipamento_especial" id="iequipamento_especial">
                    <label for="iequipamento_especial">Equipamento Especial</label>
                </p>
                <p>
                    <input type="radio" name="esporte_tipo" id="iesporte_coletivo" value="coletivo" checked>
                    <label for="iesporte_coletivo">Esporte Coletivo</label>
                    <input type="radio" name="esporte_tipo" id="iesporte_individual" value="individual">
                    <label for="iesporte_individual">Esporte Individual</label>
                </p>
                <p>
                    <label for="inivel">Nível:</label>
                    <select name="nivel" id="inivel" required>
                        <option value="">Selecione</option>
                        <option value="iniciante">Iniciante</option>
                        <option value="intermediario">Intermediário</option>
                        <option value="avancado">Avançado</option>
                    </select>
                </p>
                <p>
                    <label for="ifrequencia">Treinos durante a semana:</label>
                    <input type="range" name="frequencia" id="ifrequencia" min="0" max="7" value="0" step="1"
                        oninput="inumfreq.value = ifrequencia.value; ihorassemanais.value = inumhoras.value * inumfreq.value">
                    <input type="number" name="numfreq" id="inumfreq" min="0" max="7" value="0" step="1"
                        oninput="ifrequencia.value = inumfreq.value; ihorassemanais.value = inumhoras.value * inumfreq.value">
                </p>
                <p>
                    <label for="ihorastreino">Horas por treino:</label>
                    <input type="range" name="horas_treino" id="ihorastreino" min="1" max="4" value="1" step="1"
                        oninput="inumhoras.value = ihorastreino.value; ihorassemanais.value = inumhoras.value * inumfreq.value">
                    <input type="number" name="numhoras" id="inumhoras" min="1" max="4" value="1" step="1"
                        oninput="ihorastreino.value = inumhoras.value; ihorassemanais.value = inumhoras.value * inumfreq.value">
                </p>
                <p>
                    <label for="ihorassemanais">Horas semanais de treino:</label>
                    <output id="ihorassemanais">0</output><span> horas</span>
                </p>
                <h1>Miscelânea</h1>
                <p>
                    <label for="icor">Cor favorita:</label>
                    <input type="color" name="cor" id="icor" value="#000000">
                </p>
                <p>
                    <label for="ifoto">Foto do cachorro:</label>
                    <input type="file" name="foto_cachorro" id="ifoto" accept="image/*">
                </p>
                <p>
                    <label for="iceb">Celebridade favorita:</label>
                    <input type="text" name="celebridade" id="iceb" list="lstcelebridade" required>
                    <datalist id="lstcelebridade">
                        <option>Michael B. Jordan</option>
                        <option>Taylor Swift</option>
                        <option>Beyoncé</option>
                        <option>Rihanna</option>
                        <option>Jennifer Lopez</option>
                        <option>Dwayne Johnson</option>
                        <option>Kanye West</option>
                        <option>Ariana Grande</option>
                        <option>Justin Timberlake</option>
                        <option>Katy Perry</option>
                        <option>Ed Sheeran</option>
                        <option>Bruno Mars</option>
                        <option>Lady Gaga</option>
                        <option>Shawn Mendes</option>
                        <option>Harry Styles</option>
                        <option>Kylie Jenner</option>
                        <option>Selena Gomez</option>
                        <option>Kim Kardashian</option>
                    </datalist>
                </p>
                <p>
                    <label for="iobs">Observações:</label> <br>
                    <textarea name="observacoes" id="iobs" rows="4" cols="50"></textarea>
                </p>
                <input type="submit" value="Enviar">
                <input type="reset" value="Limpar">

    </div>
    </form>
    </div>


</body>

</html>
