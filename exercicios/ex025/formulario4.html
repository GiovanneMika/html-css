<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Output</title>
</head>
<body>
    <form action="cadastro.php" method="get" oninput="itot.value = Number(ipreco.value) * Number(iquant.value)">
        <p>
            <label for="iproduto">Produto: </label>
            <input type="text" name="produto" id="iproduto">
        </p>
        <p>
            <label for="ipreco">Preço: R$</label>
            <input type="number"  id="ipreco" name="preco" placeholder="Preço do produto">
        </p>
        <p>
            <label for="iquant">Quantidade:</label>
            <input type="number" id="iquant" name="quantidade" placeholder="Quantidade do produto">
        </p>
        <p>
            <label for="itot">Total: R$</label>
            <output name="tot" id="itot">0</output>
        </p>
            <p><input type="submit" value="Calcular"></p>
    </form>

    
</body>
</html>
