<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercício de tabela</title>
    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
        }
        caption {
            font-weight: bold;
            margin-bottom: 10px;
            font-size: 1.2em;
        }

        table{
            border-collapse: collapse;
        }

        td, th {
            border: 1px solid black;
            padding: 8px;
            text-align: center;
            vertical-align: middle;
        }

        table {
            width: 500px;
        }

        .nome {
            background-color: gray;
            color: white;
        }

        .sexo {
            background-color: lightblue;
        }

        .idade {
            background-color: lightgreen;
        }

        .profissao {
            background-color: lightcoral;
        }
    </style>
</head>
<body>

    <h1>Exercício de Tabelas</h1>
    <table>
        <colgroup>
            <col class="nome">
            <col class="sexo">
            <col class="idade">
            <col class="profissao">
        </colgroup>
        <caption>Cadastro</caption>
        <tr>
            <th scope="col">Nome</th>
            <th scope="col">Sexo</th>
            <th scope="col">Idade</th>
            <th scope="col">Profissão</th>
        </tr>
        <tr>
            <td>João</td>
            <td>Masculino</td>
            <td>25</td>
            <td>Engenheiro</td>
        </tr>
        <tr>
            <td>Maria</td>
            <td>Feminino</td>
            <td>30</td>
            <td>Médica</td>
        </tr>
        <tr>
            <td>Carlos</td>
            <td>Masculino</td>
            <td>28</td>
            <td>Professor</td>
        </tr>
    </table>
    
</body>
</html>
