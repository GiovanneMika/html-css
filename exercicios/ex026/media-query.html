<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Media Query</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
        }

        h1 {
            background-color: #4CAF50;
            color: white;
            padding: 10px 0;
            text-align: center;
        }

        p {
            padding: 10px;
        }

        /* Estilos para tablets */
        @media (min-width: 768px) and (max-width: 992px) {
            body {
                background-color: lightblue;
            }

            h1 {
                font-size: 24px;
            }

            p {
                font-size: 14px;
            }
            h1#tablet {
                background-color: red;
                color: blue;
            }
        }

        /* Estilos para desktops/notebooks */
        @media (min-width: 992px) and (max-width: 1200px) {
            body {
                background-color: lightgreen;
            }

            h1 {
                font-size: 28px;
            }

            p {
                font-size: 16px;
            }
            h1#desktop {
                background-color: red;
                color: blue;
            }
        }

        /* Estilos para telas grandes */
        @media (min-width: 1200px) {
            body {
                background-color: lightcoral;
            }

            h1 {
                font-size: 32px;
            }

            p {
                font-size: 18px;
            }
            h1#dispositivos-grandes {
                background-color: red;
                color: blue;
            }
        }

        @media print {
            body {
                background-color: white;
                color: black;
            }

            h1 {
                font-size: 20px;
            }

            p {
                font-size: 12px;
            }
        }
    </style>
</head>
<body>
    <h1 id="mobile">Tela para Dispositivos Móveis</h1>
    <h1 id="tablet">Tela para Tablets</h1>
    <h1 id="desktop">Tela para Desktops</h1>
    <h1 id="dispositivos-grandes">Tela para Dispositivos Grandes</h1>
    <h1 id="print">Tela para Impressão</h1>

</body>
</html>
